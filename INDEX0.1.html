<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch</title>
</head>
<body>
    <script>
        let valor;
        valor = parseInt(prompt('Ingrese un número del 1 al 5:'));
        switch (valor) {
            case 1:
                document.write('El número ingresado es uno');
                break;
            case 2:
                document.write('El número ingresado es dos');
                break;
            case 3:
                document.write('El número ingresado es tres');
                break;
            case 4:
                document.write('El número ingresado es cuatro');
                break;
            case 5:
                document.write('El número ingresado es cinco');
                break;
            default:
                document.write('Número fuera de rango.');
        }
    </script>

</body>

</html>
</body>
</html>
