<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While</title>
</head>
<body>
    <script>
        let i = 40;
        while (i >= 0) {
            document.write(i + "," );
            i = i-2;
        }
    </script>
</body>
</html>
