<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Problema 3</title>
</head>
<body>
    <script>
        let numero = parseInt(prompt('Ingrese un número entero positivo (1 al 99):'));

        if (numero >= 10) {
            document.write('El número tiene dos dígitos');
        } else {
            document.write('El número tiene un dígito');
        }
    </script>
</body>
</html>
