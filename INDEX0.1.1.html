<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch</title>
</head>
<body>
    <script>
        let color = prompt('Ingrese Y o B o R para escoger el color:');
        switch (color) {
            case "Y":
                alert('La letra ingresada corresponde al color Amarillo');
                break;
            case "B":
                alert('La letra ingresada corresponde al color Azul');
                break;
            case "R":
                alert('La letra ingresada corresponde al color Rojo');
                break;
            default:
                alert('Color fuera de rango.');
                break;
        }
    </script>

</body>

</html>
