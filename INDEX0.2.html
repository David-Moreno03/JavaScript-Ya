<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While</title>
</head>
<body>
    <script>
        let i = 0;
        let f = 70;
        let p = 3;
        while (i < f) {
            document.write(i + "<br>" );
            i = i+p;
        }
    </script>
</body>
</html>
